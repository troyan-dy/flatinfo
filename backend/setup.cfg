# flake8 здесь только как раннер wemake-python-styleguide (WPS).
# Остальной линт (pyflakes/pycodestyle/isort/...) — у ruff, см. pyproject.toml.
[flake8]
select = WPS
max-line-length = 100
exclude =
    .git,
    .venv,
    __pycache__,
    .mypy_cache,
    .pytest_cache,
    .ruff_cache,
per-file-ignores =
    # Тесты — стандартные послабления:
    # WPS202 — модуль с тестами естественно содержит много функций;
    # WPS218 — сценарный тест проверяет несколько полей ответа подряд;
    # WPS226 — повторяющиеся литералы фикстур (адреса, ключи JSON Nominatim);
    # WPS430 — фейки для monkeypatch/MockTransport держим замыканиями рядом с тестом;
    # WPS432 — числа в тестах — ожидаемые значения и HTTP-коды, имя им не нужно.
    tests/*.py: WPS202, WPS218, WPS226, WPS430, WPS432
